resources:
  - key: main
    path: static/app/build

modules:
  jira:issuePanel:
    - key: dam-access-config-panel
      title: Database Access Configuration
      resource: main
      resolver:
        function: dam-api-handler
      icon: https://ami.hagrids.com/favicon.png
      displayConditions:
        issueType: "Database Access Request"

  jira:issueAction:
    - key: show-database-access-config
      title: Show Database Access Config
      resource: main

  function:
    - key: dam-api-handler
      handler: resolvers/webhook.handler

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:project:jira
  content:
    styles:
      - unsafe-inline
  external:
    fetch:
      backend:
        - address: "https://inerasable-lucienne-gratuitously.ngrok-free.dev"
        - address: "https://ami.hagrids.com"

app:
  id: ari:cloud:ecosystem::app/0d47a933-26fb-4e06-8a5f-36f01b50f772
  runtime:
    name: nodejs22.x