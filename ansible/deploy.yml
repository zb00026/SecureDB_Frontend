---
- name: Deploy Frontend on EC2 Instance
  hosts: ec2
  become: true

  tasks:
    - name: Install required packages
      dnf:
        name:
          - nginx
          - python3
          - python3-pip
          - openssl
        state: latest

    - name: Install boto3 and botocore Python libraries
      pip:
        name:
          - boto3
          - botocore
        state: latest

    - name: Ensure the frontend directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0770'
        owner: 'nginx'
        group: 'nginx'
      loop:
        - "/var/www"
        - "/var/www/frontend"

    - name: Debug Frontend Artifact
      debug:
        msg: "Frontend Artifact: {{ frontend_artifact }}"

    - name: Download frontend artifact from S3 using AWS CLI
      shell: |
        pip3 install awscli --upgrade --user
        export AWS_ACCESS_KEY_ID="{{ aws_access_key }}"
        export AWS_SECRET_ACCESS_KEY="{{ aws_secret_key }}"
        export AWS_DEFAULT_REGION="ap-south-1"
        aws s3 cp s3://{{ s3_bucket }}/{{ frontend_artifact }} /tmp/{{ frontend_artifact }} --region ap-south-1

    - name: Unzip frontend artifact
      unarchive:
        src: "/tmp/{{ frontend_artifact }}"
        dest: "/var/www/frontend"
        remote_src: yes

    - name: Stop Nginx service
      systemd:
        name: nginx
        state: stopped
      ignore_errors: yes

    - name: Remove existing Nginx configuration
      file:
        path: "/etc/nginx/nginx.conf"
        state: absent
      ignore_errors: yes

    - name: Copy Nginx configuration file with sudo
      command: sudo cp /tmp/nginx.conf /etc/nginx/nginx.conf

    - name: Set ownership and permissions for nginx.conf
      command: sudo chown nginx:nginx /etc/nginx/nginx.conf

    - name: Set file permissions for nginx.conf
      command: sudo chmod 640 /etc/nginx/nginx.conf
    
    - name: Reload Nginx service
      systemd:
        name: nginx
        state: reloaded

    - name: Start Nginx service
      systemd:
        name: nginx
        state: started
        enabled: yes