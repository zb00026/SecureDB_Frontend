---
- name: Deploy Frontend on EC2 Instance
  hosts: ec2
  become: true

  tasks:
    - name: Install required packages
      dnf:
        name:
          - nginx
          - python3
          - python3-pip
          - openssl
        state: latest
    - name: Install boto3 and botocore Python libraries
      pip:
        name:
          - boto3
          - botocore
        state: latest

    - name: Start and enable Nginx service
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Ensure the frontend directory exists
      file:
        path: "/var/www"
        state: directory
        mode: '0770'
        owner: 'nginx'
        group: 'nginx'

    - name: Ensure the frontend directory exists
      file:
        path: "/var/www/frontend"
        state: directory
        mode: '0770'
        owner: 'nginx'
        group: 'nginx'

    - name: Debug Frontend Artificat
      debug:
        msg: "Frontend Artifact: {{ frontend_artifact }}"

    - name: Download frontend artifact from S3 using AWS CLI
      shell: |
        pip3 install awscli --upgrade --user
        export AWS_ACCESS_KEY_ID="{{ aws_access_key }}"
        export AWS_SECRET_ACCESS_KEY="{{ aws_secret_key }}"
        export AWS_DEFAULT_REGION="ap-south-1"
        aws s3 cp s3://{{ s3_bucket }}/{{ frontend_artifact }} /tmp/{{ frontend_artifact }} --region ap-south-1

    - name: Unzip frontend artifact
      unarchive:
        src: "/tmp/{{ frontend_artifact }}"
        dest: "/var/www/frontend"
        remote_src: yes

    - name: Configure Nginx to serve the frontend
      shell: |
        # Configure Nginx to serve the frontend
        echo "user nginx;
        worker_processes auto;
        error_log /var/log/nginx/error.log;
        pid /run/nginx.pid;

        events {
            worker_connections 1024;
        }

        http {
            include             /etc/nginx/mime.types;
            default_type        application/octet-stream;
            
            server {
                listen 80;
                server_name {{  domain_name }};

                root /var/www/frontend;
                index index.html;

                location / {
                    try_files \$uri \$uri/ /index.html;
                }

                location /health {
                    return 200 "Healthy";
                }

                location /api {
                    proxy_pass http://127.0.0.1:8080;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
        }" | sudo tee /etc/nginx/nginx.conf > /dev/null

        # Reload Nginx configuration
        sudo systemctl reload nginx

    - name: Restart Nginx service
      systemd:
        name: nginx
        state: restarted
        enabled: yes



