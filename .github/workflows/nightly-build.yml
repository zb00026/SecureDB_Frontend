name: Nightly Build for Frontend with AWS SES Notification

on:
  schedule:
    # Runs every day at midnight (UTC)
    - cron: "0 0 * * *"  # Change if you want a different schedule
  push:
    branches:
      - main
  pull_request:
    branches: [ "main" ]
      
  workflow_dispatch:  # Allows manual trigger of the workflow

jobs:
  frontend_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # To fetch repository content
    outputs:
        timestamp: ${{ steps.timestamp_output.outputs.timestamp }}
    strategy:
      matrix:
        node-version: [23.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set timestamp variable
      id: timestamp
      run: echo "timestamp=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV
    
    - name: Load .env.production variables
      run: |
        # Load the .env.production file
        set -o allexport
        source .env.production
        set +o allexport
        # Save the variables to GITHUB_ENV
        echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> $GITHUB_ENV
        echo "FRONTEND_ARTIFACT_PREFIX=$FRONTEND_ARTIFACT_PREFIX" >> $GITHUB_ENV
    # Set timestamp as output for the next job
    - name: Set timestamp as output for next job
      id: timestamp_output
      run: echo "timestamp=${{ env.timestamp }}" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn' # Cache Yarn dependencies

    - name: Install dependencies
      run: yarn install

    - name: TypeScript check
      run: yarn tsc --noEmit

    - name: Build the project
      run: yarn build

    - name: Verify dist folder and list its contents
      run: |
        # Check if the dist folder exists and list its contents
        if [ -d "dist" ]; then
          echo "Dist folder exists"
          ls -lh dist/
        else
          echo "Dist folder does not exist!"
          exit 1
        fi

    - name: Bundle frontend build artifact
      run: |
        # Create a zip file with the built frontend
        cd dist
        echo "Zipping the frontend build ${{ env.FRONTEND_ARTIFACT_PREFIX }}-${{ env.timestamp }}.zip"
        zip -r "../${{ env.FRONTEND_ARTIFACT_PREFIX }}-${{ env.timestamp }}.zip" ./*
        cd ..

    - name: Install AWS CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip
        sudo pip3 install awscli --upgrade --user

    - name: Configure AWS CLI
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set region ap-south-1

    - name: Upload frontend artifact to S3
      run: |
        # Ensure the file exists and upload it to S3
        if [ -f "${{ env.FRONTEND_ARTIFACT_PREFIX }}-${{ env.timestamp }}.zip" ]; then
          echo "Uploading frontend artifact ${{ env.FRONTEND_ARTIFACT_PREFIX }}-${{ env.timestamp }}.zip to S3..."
          aws s3 cp "${{ env.FRONTEND_ARTIFACT_PREFIX }}-${{ env.timestamp }}.zip" s3://${{ env.S3_BUCKET_NAME }}/ --region ap-south-1
        else
          echo "Artifact not found, cannot upload to S3!"
          exit 1
        fi

  notify_on_failure:
    needs: frontend_build
    if: failure()  # Only runs if the frontend build fails
    runs-on: ubuntu-latest

    steps:

    - name: Install AWS CLI
      run: |
        sudo apt-get update        
        sudo apt-get install -y python3 python3-pip
        sudo pip3 install awscli --upgrade --user

    - name: Configure AWS CLI
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set region ap-south-1

    - name: Send failure notification email using AWS SES
      run: |
        SUBJECT="Nightly Frontend Build Failure"
        BODY="The nightly build for the frontend has failed. Please check the logs for more details."
        EMAIL_FROM="m_abhi@mindslake.com"  # Verified email address in SES
        EMAIL_TO="abhinandanb@mindslake.com"  # Email to notify in case of failure

        aws ses send-email \
          --region ap-south-1 \
          --from "$EMAIL_FROM" \
          --destination "ToAddresses=$EMAIL_TO" \
          --message "Subject={Data=$SUBJECT},Body={Text={Data=$BODY}}"

  deploy_to_ec2:
    needs: frontend_build
    if: success()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update and install Ansible
      run: |
        sudo apt-get update
        sudo apt-get install -y ansible

    - name: Load .env.production variables
      run: |
        # Load the .env.production file
        set -o allexport
        source .env.production
        set +o allexport
        # Save the variables to GITHUB_ENV
        echo "HOST_DOMAIN=$HOST_DOMAIN" >> $GITHUB_ENV
        echo "HOST_IP_ADDRESS=$HOST_IP_ADDRESS" >> $GITHUB_ENV
        echo "HOST_USER=$HOST_USER" >> $GITHUB_ENV
        echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> $GITHUB_ENV
        echo "FRONTEND_ARTIFACT_PREFIX=$FRONTEND_ARTIFACT_PREFIX" >> $GITHUB_ENV

    - name: Generate inventory.ini from template
      run: |
        export HOST_DOMAIN=${{ env.HOST_DOMAIN }}
        export HOST_USER=${{ env.HOST_USER }}
        envsubst < ansible/inventory.ini.j2 > ansible/inventory.ini

    - name: Set up SSH for EC2
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ env.HOST_DOMAIN }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2 using Ansible
      run: |
        ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e "domain_name=${{ env.HOST_DOMAIN }} s3_bucket=${{ env.S3_BUCKET_NAME }} frontend_artifact=${{ env.FRONTEND_ARTIFACT_PREFIX }}-${{ needs.frontend_build.outputs.timestamp }}.zip aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }} aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
