name: Nightly Build for Frontend with AWS SES Notification

on:
  schedule:
    # Runs every day at midnight (UTC)
    - cron: "0 0 * * *"  # Change if you want a different schedule
  push:
    branches:
      - main
  pull_request:
    branches: [ "main" ]
      
  workflow_dispatch:  # Allows manual trigger of the workflow

jobs:
  frontend_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # To fetch repository content
    outputs:
        timestamp: ${{ steps.timestamp_output.outputs.timestamp }}
    strategy:
      matrix:
        node-version: [23.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set branch name variable
      run: |
        BRANCH_NAME="${GITHUB_REF_NAME:-unknown}"
        BRANCH_NAME="${BRANCH_NAME//\//-}"
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

    - name: Set timestamp variable
      id: timestamp
      run: echo "timestamp=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV
    
    - name: Write Firebase config to file
      run: |
        # First, ensure the file ends with a newline
        echo "" >> .env.production
        
        if [ -z "${{ secrets.FIREBASE_API_KEY }}" ]; then
          echo "Using hardcoded Firebase API key"
          echo -e "VITE_FIREBASE_API_KEY=AIzaSyC8_BbePSsR3tcRetXw5ldMAymrPf7uvxY" >> .env.production
        else
          echo "Using secret Firebase API key"
          echo -e "VITE_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env.production
        fi

    - name: Show .env.production content
      run: cat .env.production

    - name: Load .env.production variables
      run: |
        # Load the .env.production file
        set -o allexport
        source .env.production
        set +o allexport
        # Save the variables to GITHUB_ENV
        echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> $GITHUB_ENV
        echo "FRONTEND_ARTIFACT_PREFIX=$FRONTEND_ARTIFACT_PREFIX" >> $GITHUB_ENV
    # Set timestamp as output for the next job
    - name: Set timestamp as output for next job
      id: timestamp_output
      run: echo "timestamp=${{ env.timestamp }}" >> "$GITHUB_OUTPUT"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn' # Cache Yarn dependencies

    - name: Install dependencies
      run: yarn install

    - name: TypeScript check
      run: yarn tsc --noEmit

    - name: Build the project
      run: yarn build

    - name: Verify dist folder and list its contents
      run: |
        # Check if the dist folder exists and list its contents
        if [ -d "dist" ]; then
          echo "Dist folder exists"
          ls -lh dist/
          cp -r ansible dist/
        else
          echo "Dist folder does not exist!"
          exit 1
        fi

    - name: Bundle frontend build artifact
      run: |
        # Create a zip file with the built frontend
        cd dist
        echo "Zipping the frontend build dam-frontend-${{ env.branch_name }}-${{ env.timestamp }}.zip"
        zip -r "../dam-frontend-${{ env.branch_name }}-${{ env.timestamp }}.zip" ./*
        cd ..

    - name: Install AWS CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip
        sudo pip3 install awscli --upgrade --user

    - name: Configure AWS CLI
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set region ap-south-1

    - name: Upload frontend artifact to S3
      run: |
        # Ensure the file exists and upload it to S3
        if [ -f "dam-frontend-${{ env.branch_name }}-${{ env.timestamp }}.zip" ]; then
          echo "Uploading frontend artifact dam-frontend-${{ env.branch_name }}-${{ env.timestamp }}.zip to S3..."
          aws s3 cp "dam-frontend-${{ env.branch_name }}-${{ env.timestamp }}.zip" s3://${{ env.S3_BUCKET_NAME }}/ --region ap-south-1
        else
          echo "Artifact not found, cannot upload to S3!"
          exit 1
        fi

  notify_on_failure:
    needs: frontend_build
    if: failure()  # Only runs if the frontend build fails
    runs-on: ubuntu-latest

    steps:

    - name: Install AWS CLI
      run: |
        sudo apt-get update        
        sudo apt-get install -y python3 python3-pip
        sudo pip3 install awscli --upgrade --user

    - name: Configure AWS CLI
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set region ap-south-1

    - name: Send failure notification email using AWS SES
      run: |
        SUBJECT="Nightly Frontend Build Failure"
        BODY="The nightly build for the frontend has failed. Please check the logs for more details."
        EMAIL_FROM="m_abhi@mindslake.com"  # Verified email address in SES
        EMAIL_TO="abhinandanb@mindslake.com"  # Email to notify in case of failure

        aws ses send-email \
          --region ap-south-1 \
          --from "$EMAIL_FROM" \
          --destination "ToAddresses=$EMAIL_TO" \
          --message "Subject={Data=$SUBJECT},Body={Text={Data=$BODY}}"
